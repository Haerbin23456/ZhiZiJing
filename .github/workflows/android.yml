name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build ABI debug APKs
        run: ./gradlew assembleDebug --project-prop=zzj.abiSplits=true

      - name: Upload arm64-v8a debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhiZiJing-debug-arm64-v8a-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Upload armeabi-v7a debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhiZiJing-debug-armeabi-v7a-apk
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
